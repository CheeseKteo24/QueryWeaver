name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy src
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_retrieval_benchmark.py --assert-minimum 0.75
      - run: python scripts/run_sql_policy_benchmark.py

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t queryweaver:ci .
      - run: docker run --detach --name queryweaver-ci --publish 8000:8000 queryweaver:ci
      - name: Wait for health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs queryweaver-ci
          exit 1
      - name: Verify browser and query endpoints
        run: python scripts/run_smoke_test.py --base-url http://127.0.0.1:8000
      - if: always()
        run: docker rm --force queryweaver-ci || true
