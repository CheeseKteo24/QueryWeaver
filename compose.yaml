services:
  queryweaver:
    build:
      context: .
    image: queryweaver:local
    init: true
    ports:
      - "8000:8000"
    environment:
      QUERYWEAVER_ENV: demo
      PORT: "8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
