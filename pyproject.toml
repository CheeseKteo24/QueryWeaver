[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "queryweaver"
version = "0.5.0"
description = "A verifiable agentic copilot for documents and SQL data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QueryWeaver contributors" }]
dependencies = ["sqlglot>=29,<30"]

[project.optional-dependencies]
api = ["fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1"]
dev = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]
retrieval = ["qdrant-client[fastembed]>=1.14.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/queryweaver"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
